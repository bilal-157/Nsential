# ============================================
# RATE LIMITING ZONES
# ============================================
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=req_limit_per_ip_strict:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # ============================================
    # BASIC SETTINGS
    # ============================================
    charset utf-8;
    server_tokens off;

    # ============================================
    # SECURITY HEADERS
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # LOGGING
    # ============================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ============================================
    # GZIP COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        application/ld+json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ============================================
    # STATIC ASSETS (1 year cache)
    # ============================================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|otf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # ============================================
    # FAVICON & ROBOTS
    # ============================================
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ============================================
    # DENY HIDDEN FILES
    # ============================================
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # MAIN APPLICATION
    # ============================================
    location / {
        limit_req zone=req_limit_per_ip burst=20 nodelay;
        limit_conn conn_limit_per_ip 10;
        try_files $uri $uri/ /index.php?$query_string;
    }
    # ============================================
    # GOOGLE OAUTH
    # ============================================
    location ~ ^/auth/google {
        limit_req zone=req_limit_per_ip_strict burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================
    # SENSITIVE ROUTES (Stricter limits)
    # ============================================
    location ~ ^/(admin|login|register|password|auth|api) {
        limit_req zone=req_limit_per_ip_strict burst=5 nodelay;
        limit_conn conn_limit_per_ip 5;
        try_files $uri $uri/ /index.php?$query_string;
    }


    # ============================================
    # POST SLUGS (for /{slug} routes)
    # ============================================
    location ~ ^/[a-zA-Z0-9_-]+$ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================
    # PHP HANDLING
    # ============================================
    location ~ \.php$ {
        limit_req zone=req_limit_per_ip burst=20 nodelay;
        limit_conn conn_limit_per_ip 10;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;

        # Performance tuning
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_temp_file_write_size 256k;
        
        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 120s;
        
        # Session path
        fastcgi_param PHP_VALUE "session.save_path=/var/www/html/storage/framework/sessions";
    }

    # ============================================
    # API ROUTES
    # ============================================
    location /api/ {
        limit_req zone=req_limit_per_ip_strict burst=10 nodelay;
        limit_conn conn_limit_per_ip 5;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================
    # ERROR PAGES
    # ============================================
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /var/www/html/public;
        internal;
    }

    # ============================================
    # UPLOAD LIMITS
    # ============================================
    client_max_body_size 20M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
}