services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    expose:
      - "9000"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # uncomment once SSL/certbot is set up
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    mem_limit: 128m
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog_cms
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # pulled from .env, not hardcoded
    volumes:
      - pgdata:/var/lib/postgresql/data
    # no "ports:" — only reachable from inside the Docker network now
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    # no "ports:" — only reachable from inside the Docker network now
    mem_limit: 256m

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work redis --tries=3 --sleep=3
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata: